server {
    listen ${NGINX_PORT};
    server_tokens off;

    # Docker's internal DNS. Resolving at request time means nginx keeps working
    # when the gateway container is recreated with a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 100k;

    # Used by the Docker HEALTHCHECK.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Single entry point: everything under /api/ goes to the API gateway.
    location /api/ {
        set $gateway http://${GATEWAY_HOST}:${GATEWAY_PORT};
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # Order UI: a single static page that calls /api on the same origin.
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location / {
        default_type application/json;
        return 404 '{"error":"Not found. Try /api/products, /api/orders or /api/status"}';
    }
}
